<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #eef0e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .business-card {
            width: 700px;
            background: #f5f7f2;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .social-icons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .social-icons a {
            text-decoration: none;
            color: #7a8a71;
            font-size: 20px;
            font-weight: bold;
        }
        .social-icons div {
            width: 1px;
            height: 20px;
            background-color: #7a8a71;
        }
        .logo-section {
            text-align: center;
            flex-grow: 1;
            width: 20%; /* Reduced width */
        }
        .logo-section img {
            width: 120px;
            margin-bottom: 5px;
        }
        .divider {
            width: 1px;
            height: 90px;
            background-color: #7a8a71;
            margin: 0 40px 0 10px;
        }
        .contact-info {
            text-align: left;
            color: #555;
            width: 60%; /* Increased width */
            margin-left: -10px;
        }
        .contact-info h2 {
            color: #7b8375;
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .contact-info p {
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .contact-info a {
            text-decoration: none;
            color: #7a8a71;
        }
        .contact-info i {
            color: #7a8a71;
        }
        /* Align phone number & location in one line */
        .contact-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="business-card">
    <div class="social-icons">
        <a href="https://www.facebook.com/australiancommercialcleaning/" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
        <div></div>
        <a href="https://twitter.com/yourprofile" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
        <div></div>
        <a href="https://www.linkedin.com/company/australian-commercial-cleaning/" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>

    <div class="logo-section">
        <img src="image/Logo.png" alt="Company Logo">
    </div>

    <div class="divider"></div>

    <div class="contact-info">
        <h2>Daniel Cavka</h2>
        <p style=" color: #7a8a71;"><u>BDM</u></p>
        
     
        <div class="contact-details">
            <p>
                <i class="fa-solid fa-phone"></i> 
                <a href="tel:+61423221383">0423 221 383</a>
            </p>
            <p>
                <i class="fa-solid fa-location-dot"></i> 
                <a href="https://www.google.com/maps/place/2%2F11+Surfers+Ave,+Mermaid+Waters+QLD+4218,+Australia/" target="_blank">
                    2/11 Surfers Ave, Mermaid Waters
                </a>
            </p>
        </div>

        <p>
            <i class="fa-solid fa-globe"></i> 
            <a href="https://www.australiancommercialcleaning.com" target="_blank">
                www.australiancommercialcleaning.com
            </a>
        </p>
    </div>
</div>

</body>
</html>
